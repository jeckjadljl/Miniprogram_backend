services:

  # Mysql 服务
  mysql:
    image: mysql:8.0.33
    container_name: mysql
    ports:
      - "${MYSQL_DOCKER_PORT:-3307}:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # 将初始化脚本挂载到容器中
    networks:
      - miniprogram-network
    command: >
      /bin/sh -c "
        echo 'NODEJS_PORT=${NODEJS_PORT}' > .env &&
        echo 'JWT_SECRET=${JWT_SECRET}' >> .env &&
        echo 'MYSQL_USERNAME=${MYSQL_USERNAME}' >> .env &&
        echo 'MYSQL_PASSWORD=${MYSQL_PASSWORD}' >> .env &&
        echo 'MYSQL_HOST=${MYSQL_HOST}' >> .env &&
        echo 'MYSQL_PORT=${MYSQL_PORT}' >> .env &&
        echo 'MYSQL_DATABASE=${MYSQL_DATABASE}' >> .env &&
        echo 'REDIS_HOST=${REDIS_HOST}' >> .env &&
        echo 'REDIS_PORT=${REDIS_PORT}' >> .env &&
        echo 'WX_APPID=${WX_APPID}' >> .env &&
        echo 'WX_APPSECRET=${WX_APPSECRET}' >> .env &&
        echo 'ALTER USER \\'root\\'@\\'localhost\\' IDENTIFIED WITH mysql_native_password BY \\'${MYSQL_PASSWORD}\\';' > /docker-entrypoint-initdb.d/init.sql &&
        /entrypoint.sh mysqld"  # 先创建.env和init.sql文件，再启动mysql服务

  # Redis 服务
  redis:
    image: redis
    container_name: redis
    ports:
      - "${REDIS_DOCKER_PORT:-6379}:6379"
    networks:
      - miniprogram-network

  # Node.js 应用服务
  miniprogram_backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NODEJS_PORT:-7001}:7001"
    depends_on:
      - mysql
      - redis
    networks:
      - miniprogram-network
    environment:
      TZ: Asia/Shanghai
      NODEJS_PORT: ${NODEJS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      WX_APPID: ${WX_APPID}
      WX_APPSECRET: ${WX_APPSECRET}
    command: >
      sh -c "
        dockerize -wait tcp://redis:6379 -timeout 60s &&
        dockerize -wait tcp://mysql:3306 -timeout 60s &&
        npx sequelize-cli db:migrate --name 20241107073749-init-all-tables.js --env development &&
        npm run dev"

networks:
  miniprogram-network:
    driver: bridge
