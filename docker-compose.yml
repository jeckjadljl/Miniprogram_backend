services:
  # Node.js 应用服务
  miniprogramsever:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniprogramserver
    ports:
      - "${NODEJS_PORT:-7001}:7001"
    depends_on:
      - mysql
      - redis
    networks:
      - miniprogram_network
    environment:
      NODEJS_PORT: ${NODEJS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      WX_APPID: ${WX_APPID}
      WX_APPSECRET: ${WX_APPSECRET}

  # MongoDB 服务
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "${MYSQL_DOCKER_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - miniprogram_network

  # Redis 服务
  redis:
    image: redis
    container_name: redis
    ports:
      - "${REDIS_DOCKER_PORT:-6379}:6379"
    networks:
      - miniprogram_network

networks:
  miniprogram_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-192.168.1.0/24}
          gateway: ${NETWORK_GATEWAY:-192.168.1.1}
